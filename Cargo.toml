[workspace]
resolver = "3"
members = [
    "crates/implicate-math",
    "crates/implicate-field",
    "crates/implicate-lexicon",
    "crates/implicate-lifter",
    "crates/implicate-rolpa",
    "crates/implicate-unfold",
    "crates/implicate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clifford = "0.3"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30"
pollster = "1.0"
hound = "3.5"

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
